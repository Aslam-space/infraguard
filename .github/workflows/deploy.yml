name: InfraGuard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: infraguard
  PYTHON_VERSION: "3.12"

jobs:

  # ==============================================================
  # JOB 1 — Test
  # ==============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: |
          python3 -c "
          from app.config import *
          from app.database import init_db
          from app.collector import get_latest
          from app.detector import start_detector
          from app.slo import get_slo_summary
          print('All imports OK')
          "

  # ==============================================================
  # JOB 2 — Security Scan (Trivy)
  # ==============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ==============================================================
  # JOB 3 — Build Docker Image
  # ==============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Verify image
        run: docker images | grep ${{ env.IMAGE_NAME }}

  # ==============================================================
  # JOB 4 — Deploy to EC2
  # ==============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          script: |
            cd ~/infraguard

            # Pull latest code
            git pull origin main

            # Rebuild and restart containers
            docker compose down
            docker compose up -d --build

            # Wait for health check
            sleep 15
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/health)

            if [ "$HEALTH" = "200" ]; then
              echo "Deploy successful — HTTP $HEALTH"
            else
              echo "Deploy failed — HTTP $HEALTH"
              exit 1
            fi

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ InfraGuard deployed successfully%0ACommit: ${{ github.sha }}%0ABranch: main" \
            -d parse_mode="HTML"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ InfraGuard deploy FAILED%0ACommit: ${{ github.sha }}" \
            -d parse_mode="HTML"
