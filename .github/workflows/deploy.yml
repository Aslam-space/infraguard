name: InfraGuard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: infraguard
  PYTHON_VERSION: "3.12"

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install flask python-dotenv psutil scikit-learn numpy

      - name: Check imports
        run: |
          python3 -c "
          from app.config import *
          from app.database import init_db
          from app.collector import get_latest
          print('All imports OK')
          "

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t ${{ env.IMAGE_NAME }}:scan .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          script: |
            cd ~/infraguard
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            sudo docker-compose down
            sudo docker-compose up -d --build
            sleep 20
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/health --connect-timeout 10)
            echo "Health check: $HEALTH"
            if [ "$HEALTH" = "200" ]; then
              echo "Deploy successful"
            else
              echo "Deploy failed HTTP $HEALTH"
              exit 1
            fi

      - name: Notify Telegram on success
        if: ${{ success() }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ InfraGuard deployed successfully%0ACommit: ${{ github.sha }}"

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ InfraGuard deploy FAILED%0ACommit: ${{ github.sha }}"
